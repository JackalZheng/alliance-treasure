<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聯盟寶藏 輔助查詢</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#1e1033;color:#eee}
.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.cell{aspect-ratio:1;background:#3a1f6b;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.5vw,20px);cursor:pointer;user-select:none}
.cell.k{background:#6b4fa8}
.thumb{cursor:pointer;border:2px solid transparent;border-radius:6px}
.thumb.sel{border-color:#facc15}
.btn{background:#7c3aed;padding:.35rem .7rem;border-radius:.4rem;font-size:.85rem}
.btn2{background:#4b5563;padding:.35rem .7rem;border-radius:.4rem;font-size:.85rem}
#pop{position:fixed;z-index:50;background:#2d1b4e;border:1px solid #a78bfa;border-radius:8px;padding:6px;display:none;grid-template-columns:repeat(3,auto);gap:4px}
#pop button{padding:4px 8px;background:#4c1d95;border-radius:5px;font-size:14px}
canvas{max-width:100%}
.panel{background:#2a1748;border-radius:10px;padding:10px;margin-bottom:10px}
</style></head><body class="p-2 md:p-4">
<h1 class="text-xl font-bold mb-2">🎃 聯盟寶藏 輔助查詢</h1>
<div class="md:flex md:gap-4">
<div class="md:w-1/2">
 <div class="panel">
  <h2 class="font-bold">① 圖庫匯入</h2>
  <div class="flex flex-wrap gap-2 my-2 text-sm">
   <label class="btn cursor-pointer">選擇圖片<input id="files" type="file" multiple accept="image/*" class="hidden"></label>
   <label class="btn cursor-pointer">選擇資料夾<input id="folder" type="file" webkitdirectory multiple class="hidden"></label>
   <button class="btn2" id="clearDb">清除圖庫</button>
  </div>
  <div class="w-full bg-gray-700 h-3 rounded"><div id="bar" class="bg-yellow-400 h-3 rounded" style="width:0"></div></div>
  <div id="status" class="text-sm mt-1">載入中…</div>
 </div>
 <div class="panel">
  <h2 class="font-bold">② 目前盤面（點格子設定圖案）</h2>
  <p class="text-xs text-gray-300">代號表示「這一格屬於哪種圖案」，只看到圖案的一部分也算。</p>
  <div id="board" class="grid10 my-2"></div>
  <div class="flex flex-wrap gap-2 text-sm">
   <button class="btn2" id="clearBoard">清除盤面</button>
   <label class="btn cursor-pointer">上傳目前盤面截圖自動判讀<input id="cur" type="file" accept="image/*" class="hidden"></label>
  </div>
 </div>
 <details class="panel"><summary class="font-bold cursor-pointer">⚙️ 校正與標記（第一次使用請做）</summary>
  <p class="text-xs my-1">1. 調整格線位置（比例），使格線對齊盤面。2. 選代號後點樣本圖上的格子加入「原型」，每種圖案標幾格（含各種部位），空白格可自動判斷。截圖中的南瓜格可標成 ?。</p>
  <div class="grid grid-cols-2 gap-1 text-xs">
   <label>左 <input id="cx0" type="number" step="0.001" class="text-black w-20"></label>
   <label>右 <input id="cx1" type="number" step="0.001" class="text-black w-20"></label>
   <label>上 <input id="cy0" type="number" step="0.001" class="text-black w-20"></label>
   <label>下 <input id="cy1" type="number" step="0.001" class="text-black w-20"></label>
  </div>
  <div class="flex flex-wrap gap-1 my-2 text-sm" id="labCodes"></div>
  <div class="text-xs mb-1">樣本圖：<select id="sampleSel" class="text-black max-w-[60%]"></select> <button class="btn2" id="undoProto">復原上一個</button></div>
  <canvas id="calib"></canvas>
  <div id="protoInfo" class="text-xs my-1"></div>
  <div class="flex flex-wrap gap-2 text-sm">
   <button class="btn2" id="expP">匯出校正/原型 JSON</button>
   <label class="btn2 cursor-pointer">匯入 JSON<input id="impP" type="file" accept=".json" class="hidden"></label>
   <button class="btn2" id="expG">匯出全部代號格 JSON</button>
   <button class="btn2" id="resetP">清除原型</button>
  </div>
 </details>
</div>
<div class="md:w-1/2">
 <div class="panel">
  <h2 class="font-bold">③ 符合的候選解答：<span id="cnt">0</span></h2>
  <div id="cands" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-5 gap-1 max-h-72 overflow-auto mt-2"></div>
 </div>
 <div class="panel">
  <h2 class="font-bold">④ 預覽與對照 <label class="text-sm font-normal ml-2">疊加透明度 <input id="op" type="range" min="0" max="1" step="0.1" value="0.8"></label></h2>
  <div id="pvName" class="text-xs"></div>
  <canvas id="pv"></canvas>
  <div id="pvGrid" class="grid10 mt-2 text-xs"></div>
 </div>
</div></div>
<div id="pop"></div>
<script>
const CODES=[['?','❔','未翻開'],['E','⬛','空白'],['A','🔱','箭矢'],['K','🗝️','鑰匙'],['C','🧰','寶箱'],['W','👑','皇冠'],['G','🎲','齒輪骰子'],['H','⚓','錨'],['B','🏹','弓']];
const ICON=Object.fromEntries(CODES.map(c=>[c[0],c[1]]));
const COLS=10,ROWS=12,FS=6,FD=FS*FS*3+6;
const DEF={x0:0.0507,x1:0.9516,y0:0.2810,y1:0.7805};
let cal=JSON.parse(localStorage.getItem('cal')||'null')||{...DEF};
let protos=JSON.parse(localStorage.getItem('protos')||'[]'); // {c,f}
let images=[]; // {id,name,thumb,feats:Float32Array[120*FD] as array}
let board=JSON.parse(localStorage.getItem('board')||'null')||Array(120).fill('?');
let labCode='A',sel=null;
const $=id=>document.getElementById(id);
// ---------- IndexedDB
let db;function openDb(){return new Promise((r,j)=>{const q=indexedDB.open('treasure',1);q.onupgradeneeded=()=>q.result.createObjectStore('img',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=j})}
function tx(m){return db.transaction('img',m).objectStore('img')}
function dbAll(){return new Promise(r=>{const q=tx('readonly').getAll();q.onsuccess=()=>r(q.result)})}
function dbPut(o){return new Promise(r=>{const q=tx('readwrite').put(o);q.onsuccess=r;q.onerror=r})}
// ---------- features
function cellFeatures(ctx,W,H,c){ // ctx holds full image
  const out=[];const bx=c.x0*W,by=c.y0*H,cw=(c.x1-c.x0)*W/COLS,ch=(c.y1-c.y0)*H/ROWS;
  const N=FS*4;const tc=document.createElement('canvas');tc.width=N*COLS;tc.height=N*ROWS;const t=tc.getContext('2d',{willReadFrequently:true});
  for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++){t.drawImage(ctx.canvas,bx+k*cw+cw*.1,by+r*ch+ch*.1,cw*.8,ch*.8,k*N,r*N,N,N)}
  const d=t.getImageData(0,0,N*COLS,N*ROWS).data,w=N*COLS;
  for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++){const f=new Array(FD).fill(0);let s=[0,0,0],s2=[0,0,0];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=((r*N+y)*w+k*N+x)*4,b=(Math.floor(y/4)*FS+Math.floor(x/4))*3;
      for(let ch=0;ch<3;ch++){const v=d[i+ch]/255;f[b+ch]+=v/16;s[ch]+=v;s2[ch]+=v*v}}
    const n=N*N;for(let ch=0;ch<3;ch++){const m=s[ch]/n;f[FS*FS*3+ch]=m;f[FS*FS*3+3+ch]=Math.sqrt(Math.max(0,s2[ch]/n-m*m))*2}
    out.push(f.map(v=>Math.round(v*1000)/1000))}
  return out}
function heur(f){const o=FS*FS*3,[r,g,b]=[f[o],f[o+1],f[o+2]],sd=f[o+3]+f[o+4]+f[o+5];
  if(sd<0.12&&b>r*1.5&&b>g*2.5&&b<0.6)return 'E';return null}
function dist(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return s}
function classify(f){const h=heur(f);if(!protos.length)return h||'?';
  let best=[];for(const p of protos){const d=dist(f,p.f);best.push([d,p.c])}best.sort((a,b)=>a[0]-b[0]);
  if(h&&!protos.some(p=>p.c==='E'))return 'E';
  const k=best.slice(0,3),v={};k.forEach(([d,c],i)=>v[c]=(v[c]||0)+1/(1+d)*(i?1:1.5));
  return Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0]}
function reclassAll(){for(const im of images)im.codes=im.feats.map(classify);filter();if(sel)preview(sel)}
// ---------- import
function loadImg(file){return new Promise((r,j)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{r(i);URL.revokeObjectURL(u)};i.onerror=j;i.src=u})}
function imgCtx(img){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);return x}
function makeThumb(ctx,W,H,w){const c=document.createElement('canvas'),sw=(cal.x1-cal.x0)*W,sh=(cal.y1-cal.y0)*H;c.width=w;c.height=Math.round(w*sh/sw);c.getContext('2d').drawImage(ctx.canvas,cal.x0*W,cal.y0*H,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.7)}
async function importFiles(list){const fs=[...list].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));
  let n=0;for(const f of fs){const id=f.name+'_'+f.size;if(images.find(x=>x.id===id)){n++;continue}
    try{const img=await loadImg(f);const ctx=imgCtx(img),W=img.naturalWidth,H=img.naturalHeight;
      const o={id,name:f.name,thumb:makeThumb(ctx,W,H,120),big:makeThumb(ctx,W,H,400),feats:cellFeatures(ctx,W,H,cal)};
      await dbPut(o);o.codes=o.feats.map(classify);images.push(o)}catch(e){console.warn(e)}
    n++;$('bar').style.width=(n/fs.length*100)+'%';$('status').textContent=`處理中 ${n}/${fs.length}`;
    if(n%5===0)await new Promise(r=>setTimeout(r,0))}
  $('status').textContent=`圖庫共 ${images.length} 張`;fillSamples();filter()}
$('files').onchange=e=>importFiles(e.target.files);$('folder').onchange=e=>importFiles(e.target.files);
$('clearDb').onclick=async()=>{if(!confirm('確定清除圖庫？'))return;tx('readwrite').clear();images=[];sel=null;$('status').textContent='圖庫共 0 張';fillSamples();filter()};
// ---------- board
const pop=$('pop');let popIdx=-1;
pop.innerHTML=CODES.map(c=>`<button data-c="${c[0]}">${c[1]} ${c[2]}</button>`).join('');
pop.onclick=e=>{const c=e.target.closest('button')?.dataset.c;if(c&&popIdx>=0){board[popIdx]=c;saveBoard()}pop.style.display='none'};
document.addEventListener('click',e=>{if(!pop.contains(e.target)&&!e.target.classList.contains('bc'))pop.style.display='none'});
function renderBoard(){$('board').innerHTML=board.map((c,i)=>`<div class="cell bc ${c!=='?'?'k':''}" data-i="${i}">${c==='?'?'':ICON[c]}</div>`).join('')}
$('board').onclick=e=>{const el=e.target.closest('.bc');if(!el)return;popIdx=+el.dataset.i;const r=el.getBoundingClientRect();pop.style.display='grid';
  pop.style.left=Math.min(r.left,innerWidth-240)+'px';pop.style.top=Math.min(r.bottom+4,innerHeight-130)+'px'};
function saveBoard(){localStorage.setItem('board',JSON.stringify(board));renderBoard();filter();if(sel)preview(sel)}
$('clearBoard').onclick=()=>{board=Array(120).fill('?');saveBoard()};
$('cur').onchange=async e=>{const f=e.target.files[0];if(!f)return;const img=await loadImg(f),ctx=imgCtx(img);
  const fe=cellFeatures(ctx,img.naturalWidth,img.naturalHeight,cal);
  board=fe.map(f=>{const o=FS*FS*3,[r,g,b]=[f[o],f[o+1],f[o+2]],sd=f[o+3]+f[o+4]+f[o+5];
    const c=classify(f);if(protos.some(p=>p.c==='?'))return c;
    // 南瓜格：偏亮的淺紫色、有橘色南瓜
    if(b>0.45&&r>0.35&&c!=='E')return '?';return c});
  saveBoard();e.target.value=''};
// ---------- filter / preview
function filter(){const known=board.map((c,i)=>[c,i]).filter(x=>x[0]!=='?');
  const res=images.filter(im=>known.every(([c,i])=>im.codes[i]===c));$('cnt').textContent=`${res.length} / ${images.length}`;
  $('cands').innerHTML=res.slice(0,300).map(im=>`<img class="thumb ${sel===im?'sel':''}" data-id="${im.id}" src="${im.thumb}" title="${im.name}">`).join('')+(res.length>300?'<div class="text-xs">僅顯示前300張</div>':'')}
$('cands').onclick=e=>{const id=e.target.dataset?.id;if(!id)return;sel=images.find(x=>x.id===id);preview(sel);filter()};
$('op').oninput=()=>sel&&preview(sel);
function preview(im){const c=$('pv'),x=c.getContext('2d'),i=new Image();i.onload=()=>{c.width=i.width;c.height=i.height;x.drawImage(i,0,0);
  const cw=c.width/COLS,ch=c.height/ROWS;x.globalAlpha=+$('op').value;x.lineWidth=3;
  board.forEach((b,k)=>{if(b==='?')return;const ok=im.codes[k]===b;x.strokeStyle=ok?'#22c55e':'#ef4444';x.strokeRect(k%COLS*cw+2,Math.floor(k/COLS)*ch+2,cw-4,ch-4)});x.globalAlpha=1};i.src=im.big;
  $('pvName').textContent=im.name;$('pvGrid').innerHTML=im.codes.map((c,k)=>`<div class="cell" style="font-size:11px;${board[k]!=='?'?(board[k]===c?'outline:2px solid #22c55e':'outline:2px solid #ef4444'):''}">${ICON[c]}</div>`).join('')}
// ---------- calibration
['x0','x1','y0','y1'].forEach(k=>{const el=$('c'+k);el.value=cal[k];el.oninput=()=>{cal[k]=+el.value;localStorage.setItem('cal',JSON.stringify(cal));drawCalib()}});
$('labCodes').innerHTML=CODES.map(c=>`<button class="btn2" data-c="${c[0]}">${c[1]}${c[2]}</button>`).join('');
$('labCodes').onclick=e=>{const c=e.target.closest('button')?.dataset.c;if(c){labCode=c;markLab()}};
function markLab(){[...$('labCodes').children].forEach(b=>b.style.background=b.dataset.c===labCode?'#7c3aed':'')}
let sampleFile=null,sampleCtx=null;
function fillSamples(){$('sampleSel').innerHTML='<option value="">（請先匯入圖片）</option>'+images.slice(0,600).map(im=>`<option value="${im.id}">${im.name}</option>`).join('')}
// sample uses full-res original? we only store crops; let user pick original file for calibration
$('sampleSel').onchange=()=>drawCalib();
const pick=document.createElement('input');pick.type='file';pick.accept='image/*';
async function drawCalib(){const c=$('calib'),x=c.getContext('2d');const id=$('sampleSel').value;
  if(sampleCtx&&!id){}
  let src=sampleCtx?sampleCtx.canvas:null;
  if(id){const im=images.find(z=>z.id===id);const i=new Image();await new Promise(r=>{i.onload=r;i.src=im.big});
    c.width=i.width;c.height=i.height;x.drawImage(i,0,0);c._mode='crop';c._im=im;}
  else if(src){c.width=400;c.height=src.height*400/src.width;x.drawImage(src,0,0,c.width,c.height);c._mode='full'}
  else{c.width=0;return}
  x.strokeStyle='#0f0';x.lineWidth=1;let X0=0,Y0=0,X1=c.width,Y1=c.height;
  if(c._mode==='full'){X0=cal.x0*c.width;X1=cal.x1*c.width;Y0=cal.y0*c.height;Y1=cal.y1*c.height}
  for(let k=0;k<=COLS;k++){const xx=X0+(X1-X0)*k/COLS;x.beginPath();x.moveTo(xx,Y0);x.lineTo(xx,Y1);x.stroke()}
  for(let r=0;r<=ROWS;r++){const yy=Y0+(Y1-Y0)*r/ROWS;x.beginPath();x.moveTo(X0,yy);x.lineTo(X1,yy);x.stroke()}
  if(c._mode==='crop'){x.font='14px sans-serif';const cw=c.width/COLS,ch=c.height/ROWS;c._im.codes.forEach((cd,k)=>{x.fillStyle='rgba(0,0,0,.55)';x.fillRect(k%COLS*cw,Math.floor(k/COLS)*ch,16,16);x.fillStyle='#fff';x.fillText(cd,k%COLS*cw+3,Math.floor(k/COLS)*ch+13)})}}
$('calib').onclick=e=>{const c=$('calib');if(c._mode!=='crop')return;const r=c.getBoundingClientRect();
  const k=Math.floor((e.clientX-r.left)/r.width*COLS),rr=Math.floor((e.clientY-r.top)/r.height*ROWS);const i=rr*COLS+k;
  protos.push({c:labCode,f:c._im.feats[i],src:c._im.id,i});saveProtos()};
$('undoProto').onclick=()=>{protos.pop();saveProtos()};
$('resetP').onclick=()=>{if(confirm('清除所有原型？')){protos=[];saveProtos()}};
function saveProtos(){localStorage.setItem('protos',JSON.stringify(protos));const cnt={};protos.forEach(p=>cnt[p.c]=(cnt[p.c]||0)+1);
  $('protoInfo').textContent='原型數：'+(CODES.map(c=>cnt[c[0]]?`${c[1]}${cnt[c[0]]}`:'').filter(Boolean).join(' ')||'0');reclassAll();drawCalib()}
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click()}
$('expP').onclick=()=>dl('treasure-protos.json',{cal,protos});
$('expG').onclick=()=>dl('treasure-grids.json',images.map(im=>({name:im.name,grid:im.codes.join('')})));
$('impP').onchange=async e=>{const o=JSON.parse(await e.target.files[0].text());if(o.cal){cal=o.cal;localStorage.setItem('cal',JSON.stringify(cal));['x0','x1','y0','y1'].forEach(k=>$('c'+k).value=cal[k])}
  if(o.protos)protos=o.protos;saveProtos();alert('已匯入。若校正值改變，請清除圖庫後重新匯入。')};
// ---------- init
(async()=>{markLab();renderBoard();await openDb();images=await dbAll();reclassAll();fillSamples();saveProtos();$('status').textContent=`圖庫共 ${images.length} 張`})();
</script></body></html>
