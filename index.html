<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聯盟寶藏 輔助查詢</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#1e1033;color:#eee}
.g10{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;user-select:none}
#board .cell{background:#3a1f6b;cursor:pointer;font-size:clamp(14px,4vw,22px)}
#board .cell.k{background:#6b4fa8}
.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;width:100%}
.mini i{aspect-ratio:1;display:block;border-radius:1px}
.cand{cursor:pointer;border:2px solid transparent;border-radius:6px;padding:2px;background:#2a1748}
.cand.sel{border-color:#facc15}
.btn{background:#7c3aed;padding:.35rem .7rem;border-radius:.4rem;font-size:.85rem;cursor:pointer}
.btn2{background:#4b5563;padding:.35rem .7rem;border-radius:.4rem;font-size:.85rem;cursor:pointer}
#pop{position:fixed;z-index:50;background:#2d1b4e;border:1px solid #a78bfa;border-radius:8px;padding:6px;display:none;grid-template-columns:repeat(3,auto);gap:4px}
#pop button{padding:4px 8px;background:#4c1d95;border-radius:5px;font-size:14px}
.panel{background:#2a1748;border-radius:10px;padding:10px;margin-bottom:10px}
canvas{max-width:100%}
</style></head><body class="p-2 md:p-4">
<h1 class="text-xl font-bold mb-2">🎃 聯盟寶藏 輔助查詢</h1>
<div class="md:flex md:gap-4">
<div class="md:w-1/2">
 <div class="panel">
  <h2 class="font-bold">① 目前盤面（點格子設定已翻開的圖案）</h2>
  <p class="text-xs text-gray-300">只看到圖案的一部分也算該圖案；「空白」= 翻開後沒有東西。</p>
  <div id="board" class="g10 my-2"></div>
  <div class="flex flex-wrap gap-2 items-center text-sm">
   <button class="btn2" id="clearBoard">清除盤面</button>
   <label><input type="checkbox" id="hideFlag"> 隱藏不完整/可疑的解答圖</label>
  </div>
  <div class="text-xs mt-2" id="legend"></div>
 </div>
 <div class="panel">
  <h2 class="font-bold">② 本機圖片（選用）</h2>
  <p class="text-xs text-gray-300">選擇「寶藏地圖（全開）」資料夾，即可在預覽中看到原圖（依檔名對應，只在你的瀏覽器中讀取，不會上傳）。</p>
  <div class="flex flex-wrap gap-2 my-2">
   <label class="btn">選擇資料夾<input id="folder" type="file" webkitdirectory multiple class="hidden"></label>
   <label class="btn2">選擇圖片<input id="files" type="file" multiple accept="image/*" class="hidden"></label>
  </div>
  <div id="status" class="text-sm">載入解答資料中…</div>
 </div>
</div>
<div class="md:w-1/2">
 <div class="panel">
  <h2 class="font-bold">③ 符合的候選解答：<span id="cnt">0</span></h2>
  <div id="cands" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-4 gap-1 max-h-80 overflow-auto mt-2"></div>
 </div>
 <div class="panel">
  <h2 class="font-bold">④ 預覽與對照</h2>
  <div id="pvName" class="text-xs mb-1">點選上方候選圖</div>
  <div id="pvGrid" class="g10"></div>
  <div class="text-xs my-2" id="pvImgCtl" style="display:none">原圖疊加透明度 <input id="op" type="range" min="0" max="1" step="0.1" value="0.9"></div>
  <canvas id="pv"></canvas>
 </div>
</div></div>
<div id="pop"></div>
<script>
const CODES=[['?','❔','未翻開','#3a1f6b'],['E','⬛','空白','#1b1030'],['A','🔱','箭矢','#facc15'],['K','🗝️','鑰匙','#cbd5e1'],['C','🧰','寶箱','#b45309'],['W','👑','皇冠','#f97316'],['G','🎲','齒輪骰子','#9ca3af'],['H','⚓','錨','#38bdf8'],['B','🏹','弓','#7c2d12']];
const ICON={},COL={},NAME={};CODES.forEach(c=>{ICON[c[0]]=c[1];NAME[c[0]]=c[2];COL[c[0]]=c[3]});
const $=id=>document.getElementById(id);
let DATA={codes:{},flags:{},grids:{}},LIST=[],sel=null;const local={};
let board=JSON.parse(localStorage.getItem('board2')||'null')||Array(120).fill('?');
$('legend').innerHTML=CODES.map(c=>`<span class="mr-2 whitespace-nowrap"><i style="display:inline-block;width:10px;height:10px;background:${c[3]}"></i> ${c[1]}${c[2]}</span>`).join('');
// filter (pure, also used by tests)
function matches(code,b){for(let i=0;i<120;i++){const c=b[i];if(c!=='?'&&code[i]!=='?'&&code[i]!==c)return false}return true}
function filter(){const hide=$('hideFlag').checked;
  const res=LIST.filter(f=>(!hide||!DATA.flags[f])&&matches(DATA.codes[f],board));
  $('cnt').textContent=`${res.length} / ${LIST.length}`;
  $('cands').innerHTML=res.slice(0,200).map(f=>`<div class="cand ${sel===f?'sel':''}" data-f="${f}">${mini(DATA.codes[f])}<div class="text-[10px] truncate">${DATA.flags[f]?'⚠️':''}${f.replace(/\.\w+$/,'')}</div></div>`).join('')+(res.length>200?'<div class="text-xs">僅顯示前200張，請再多標幾格</div>':'');
  if(res.length===1&&sel!==res[0]){sel=res[0];preview()}}
function mini(code){return '<div class="mini">'+[...code].map(c=>`<i style="background:${COL[c]}"></i>`).join('')+'</div>'}
$('cands').onclick=e=>{const el=e.target.closest('.cand');if(!el)return;sel=el.dataset.f;preview();filter()};
$('hideFlag').onchange=filter;
// board
const pop=$('pop');let popIdx=-1;
pop.innerHTML=CODES.map(c=>`<button data-c="${c[0]}">${c[1]} ${c[2]}</button>`).join('');
pop.onclick=e=>{const c=e.target.closest('button')?.dataset.c;if(c&&popIdx>=0){board[popIdx]=c;save()}pop.style.display='none'};
document.addEventListener('click',e=>{if(!pop.contains(e.target)&&!e.target.closest('#board'))pop.style.display='none'});
function renderBoard(){$('board').innerHTML=board.map((c,i)=>`<div class="cell ${c!=='?'?'k':''}" data-i="${i}">${c==='?'?'':ICON[c]}</div>`).join('')}
$('board').onclick=e=>{const el=e.target.closest('.cell');if(!el)return;popIdx=+el.dataset.i;const r=el.getBoundingClientRect();pop.style.display='grid';
  pop.style.left=Math.max(4,Math.min(r.left,innerWidth-250))+'px';pop.style.top=Math.min(r.bottom+4,innerHeight-140)+'px'};
function save(){localStorage.setItem('board2',JSON.stringify(board));renderBoard();filter();if(sel)preview()}
$('clearBoard').onclick=()=>{board=Array(120).fill('?');save()};
// preview
function preview(){const code=DATA.codes[sel];if(!code)return;
  $('pvName').innerHTML=`${sel}${DATA.flags[sel]?' <span class="text-yellow-300">⚠️ '+DATA.flags[sel].join('、')+'</span>':''}`;
  $('pvGrid').innerHTML=[...code].map((c,k)=>{const b=board[k];const st=b==='?'?'':(b===c?'outline:3px solid #22c55e;outline-offset:-3px':'outline:3px solid #ef4444;outline-offset:-3px');
    return `<div class="cell" style="background:${COL[c]}55;font-size:clamp(12px,3.5vw,20px);${st}" title="${NAME[c]}">${c==='E'?'':ICON[c]}</div>`}).join('');
  const file=local[sel],cv=$('pv');if(!file||!DATA.grids[sel]){cv.width=0;$('pvImgCtl').style.display='none';return}
  $('pvImgCtl').style.display='';const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const [x,y,s]=DATA.grids[sel];
    const sc=Math.min(1,500/(10*s));cv.width=Math.round(10*s*sc);cv.height=Math.round(12*s*sc);const g=cv.getContext('2d');
    g.drawImage(img,x,y,10*s,12*s,0,0,cv.width,cv.height);const cs=s*sc;g.globalAlpha=+$('op').value;g.lineWidth=3;
    board.forEach((b,k)=>{if(b==='?')return;g.strokeStyle=code[k]===b?'#22c55e':'#ef4444';g.strokeRect(k%10*cs+2,Math.floor(k/10)*cs+2,cs-4,cs-4)});g.globalAlpha=1;URL.revokeObjectURL(u)};img.src=u}
$('op').oninput=preview;
function addLocal(list){let n=0;for(const f of list){if(DATA.codes[f.name]){local[f.name]=f;n++}}$('status').textContent=`解答圖 ${LIST.length} 張；本機已對應原圖 ${Object.keys(local).length} 張`;if(sel)preview()}
$('folder').onchange=e=>addLocal(e.target.files);$('files').onchange=e=>addLocal(e.target.files);
// init
renderBoard();
fetch('codes.json').then(r=>r.json()).then(j=>{DATA=j;DATA.flags=j.flags||{};DATA.grids=j.grids||{};LIST=Object.keys(j.codes).sort();
  $('status').textContent=`解答圖 ${LIST.length} 張（其中 ${Object.keys(DATA.flags).length} 張標示 ⚠️ 不完整或可疑）`;filter()})
 .catch(e=>{$('status').textContent='無法載入 codes.json：'+e});
if(typeof module!=='undefined')module.exports={matches};
</script></body></html>
